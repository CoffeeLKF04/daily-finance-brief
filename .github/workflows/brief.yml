name: Daily Finance Brief

on:
  schedule:
    # 每天 UTC 00:30 运行 = 北京时间早上 08:30
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-brief:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取数据并生成网页早报
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python daily_brief.py --generate

      - name: 提交并发布到 GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: update daily brief $(date -u +'%Y-%m-%d')"
          git push

      - name: 等待 GitHub Pages 刷新
        run: sleep 25

      - name: 发送飞书精简入口卡片
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python daily_brief.py --notify
