name: Daily Finance Brief

on:
  workflow_dispatch:
    inputs:
      edition:
        description: '选择推送版本（auto 自动判断，am=早报，close=收盘报，pm=晚报）'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - am
          - close
          - pm

permissions:
  contents: write

# 定时 cron（服务器三档）与手动测试很容易撞在一起：
# 两次运行同时 git push 会让后者 non-fast-forward 失败，而且是在烧完 LLM token 之后才失败。
# 这里串行化——后来的排队等待，不取消正在跑的那次。
concurrency:
  group: daily-finance-brief
  cancel-in-progress: false

jobs:
  run-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v5

      - name: 配置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取数据并生成网页早/收盘/晚报
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python daily_brief.py --generate --edition ${{ inputs.edition || 'auto' }}

      - name: 提交并发布到 GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: update brief ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

      - name: 等待 GitHub Pages 刷新
        run: sleep 30

      - name: 发送飞书入口卡片
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python daily_brief.py --notify
