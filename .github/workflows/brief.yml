name: Daily Finance Brief

on:
  schedule:
    # 每天 UTC 00:30 运行 = 北京时间早上 08:30（自动识别为早报）
    - cron: '30 0 * * *'
    # 每天 UTC 14:00 运行 = 北京时间晚上 22:00（自动识别为晚报）
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      edition:
        description: '选择推送版本（auto 按北京时间自动判断，am=早报，pm=晚报）'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - am
          - pm

permissions:
  contents: write

jobs:
  run-brief:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取数据并生成网页早/晚报
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python daily_brief.py --generate --edition ${{ inputs.edition || 'auto' }}

      - name: 提交并发布到 GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: update brief ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

      - name: 等待 GitHub Pages 刷新
        run: sleep 30

      - name: 发送飞书入口卡片
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python daily_brief.py --notify
